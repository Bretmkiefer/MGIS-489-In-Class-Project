<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Launchpad</title>
  <meta name="description" content="Career Launch Dashboard and Student Budget Companion: track applications, interviews, events and spending, with a daily career task and daily spending allowance.">
  <meta name="theme-color" content="#15183b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#overview"><span class="logo" aria-hidden="true">↗</span><span>Launchpad<small>YOUR NEXT CHAPTER</small></span></a>
    <p class="nav-label">WORKSPACE</p>
    <nav class="tabs" aria-label="Sections">
      <a href="#overview">Overview</a>
      <a href="#budget">Budget</a>
      <a href="#applications">Applications</a>
      <a href="#interviews">Interviews</a>
      <a href="#events">Events</a>
      <a href="#opportunities">Opportunities</a>
      <a href="#profile">Profile</a>
    </nav>
    <div class="sidebar-note"><span class="note-spark" aria-hidden="true">✦</span><strong>Small steps. Big futures.</strong><p>A little progress, every day.</p><a href="#profile">Make it yours <span aria-hidden="true">↗</span></a></div>
    <div class="sidebar-footer"><span class="student-avatar" aria-hidden="true">S</span><div>Student workspace<small>Career & everyday life</small></div></div>
  </header>

  <main id="app" tabindex="-1"></main>

  <dialog id="form-dialog" aria-labelledby="form-title">
    <form id="entry-form" novalidate>
      <h2 id="form-title"></h2>
      <div id="form-fields" class="fields"></div>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="form-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="form-submit">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body" class="muted"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost">Cancel</button>
        <button value="ok" class="btn danger" id="confirm-ok">Delete</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
